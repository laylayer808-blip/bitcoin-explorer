<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 class="logo">&#8383; Bitcoin Explorer</h1>
    <form id="search-form">
      <input id="search" type="text"
        placeholder="Block hash, height, TXID or address" required>
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <section id="home" class="view">
      <div id="stats" class="stats-grid"></div>
      <h2>Latest Blocks</h2>
      <div id="blocks" class="blocks-list"></div>
    </section>

    <section id="block-view" class="view hidden"></section>
    <section id="tx-view" class="view hidden"></section>
    <section id="address-view" class="view hidden"></section>
    <section id="error-view" class="view hidden"></section>
  </main>

  <footer>
    <p>Bitcoin Blockchain Explorer &mdash; Diploma Project, ULIM 2026</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
